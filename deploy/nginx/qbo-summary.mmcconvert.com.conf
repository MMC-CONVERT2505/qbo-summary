# nginx site config for qbo-summary.mmcconvert.com
#
# Modelled directly on the existing
# /etc/nginx/sites-enabled/qbo-xero-attachment.mmcconvert.com — same host,
# same shared nginx, same certbot flow. Two differences from that reference,
# both deliberate:
#
#   1. Everything proxies to ONE port. QBO Summary is a single container that
#      serves both the API and the built React client (see server/src/index.js),
#      unlike the frontend/backend split the attachment tool uses — no /auth
#      or /api split needed.
#
#   2. /api/summary/stream gets proxy_buffering off. That endpoint streams
#      live build progress over Server-Sent Events (a long-lived GET, not a
#      websocket). Nginx buffers proxied responses by default, which would
#      hold the entire stream back until the build finished and the counting
#      screen would sit frozen then jump — this directive forwards each event
#      the moment the app writes it.
#
# This starts HTTP-only on purpose. Run `sudo certbot --nginx -d
# qbo-summary.mmcconvert.com` after installing it — certbot detects this
# block and rewrites it in place to add the listen 443 ssl block, the
# certificate paths, and the port-80-redirect block, exactly like it already
# did for qbo-xero-attachment.mmcconvert.com. Don't hand-write the SSL lines;
# let certbot generate them so the paths are guaranteed correct.

server {
    listen 80;
    server_name qbo-summary.mmcconvert.com;

    location /api/summary/stream {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A full build (counts + financials + attachments) can run 20-30s+
        # on a large file — comfortably longer than nginx's 60s default, but
        # give it real headroom rather than cutting a slow build off mid-stream.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
